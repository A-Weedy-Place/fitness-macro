name: Prepare release

on:
  # Optional larger-release tooling. Small preview patches carry their version in
  # the feature PR so publishing does not need a second bot PR / second CI pass.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
