name: Build release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build and attach Android APK
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify tag matches the app version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${{ inputs.tag }}" = "v${package_version}" || {
            echo "Tag ${{ inputs.tag }} does not match mobile/package.json version ${package_version}."
            exit 1
          }
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed APK
        shell: bash
        run: eas build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
      - name: Download APK from EAS
        shell: bash
        run: |
          apk_url="$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")"
          test -n "$apk_url" && test "$apk_url" != "null"
          curl --fail --location "$apk_url" --output "$RUNNER_TEMP/Weed-Fitness-${{ inputs.tag }}.apk"
      - name: Attach APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "$RUNNER_TEMP/Weed-Fitness-${{ inputs.tag }}.apk" --clobber
